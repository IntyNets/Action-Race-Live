services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tiktok-live-3d-race-dev
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

